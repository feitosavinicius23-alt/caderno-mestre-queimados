# Sincronização e conferência do Caderno Mestre.
#
# Baixa o Google Doc, reimporta o conteúdo, valida a estrutura e, se algo mudou, faz commit.
# O Cloudflare Pages detecta o commit e publica sozinho — nenhum token de
# Cloudflare é necessário aqui (requisitos 58, 95).
name: Sincronizar Caderno Mestre

on:
  schedule:
    # Horários principais (Brasília): 07:20, 11:10, 15:10 e 19:10.
    # As execuções 10 minutos depois repetem a conferência e corrigem qualquer
    # conteúdo que tenha sido salvo no documento após a primeira leitura.
    # GitHub usa UTC e o Brasil é UTC-3 o ano inteiro (não há mais horário de verão).
    - cron: '20 10 * * *'   # 07:20 Brasília — sincronização
    - cron: '30 10 * * *'   # 07:30 Brasília — conferência corretiva
    - cron: '10 14 * * *'   # 11:10 Brasília — sincronização
    - cron: '20 14 * * *'   # 11:20 Brasília — conferência corretiva
    - cron: '10 18 * * *'   # 15:10 Brasília — sincronização
    - cron: '20 18 * * *'   # 15:20 Brasília — conferência corretiva
    - cron: '10 22 * * *'   # 19:10 Brasília — sincronização
    - cron: '20 22 * * *'   # 19:20 Brasília — conferência corretiva
  workflow_dispatch:         # BOTÃO "Run workflow" no painel do GitHub
    inputs:
      motivo:
        description: 'Motivo da sincronização manual (opcional)'
        required: false
        default: 'sincronização manual'

permissions:
  contents: write

concurrency:
  group: sync-caderno
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Baixar o Caderno Mestre
        run: npm run fetch-caderno

      - name: Importar e sincronizar
        run: npm run import-caderno

      - name: Validar
        run: npm run validate-content

      - name: Build de verificação
        run: npm run build

      - name: Commit das alterações de conteúdo
        run: |
          if [ -z "$(git status --porcelain content/ public/sitemap.xml public/sync-source.json)" ]; then
            echo "Nenhuma alteração no conteúdo ou nos arquivos gerados. Nada a publicar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ public/sitemap.xml public/sync-source.json
          AULAS=$(node -e "console.log(require('./content/manifest.json').totalAulas)")
          git commit -m "chore(content): sync do Caderno Mestre — ${AULAS} aulas"
          git push
